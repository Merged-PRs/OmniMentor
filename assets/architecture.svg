<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">One source, three hosts</title>
  <desc id="archDesc">A shared instruction core generates the Claude Code skill, the ChatGPT brief and knowledge file, and the OpenCode skill.</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#0E1622"/>
    </linearGradient>
    <pattern id="archGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" stroke="#131C28" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#3B4A5E"/>
    </marker>
    <clipPath id="archCard">
      <rect x="1" y="1" width="1198" height="358" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#archCard)">
    <rect width="1200" height="360" fill="url(#archBg)"/>
    <rect width="1200" height="360" fill="url(#archGrid)" opacity="0.4"/>

    <text x="56" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="3.2" fill="#5EEAD4">ONE SOURCE, THREE HOSTS</text>

    <rect x="56" y="96" width="330" height="168" rx="14" fill="#0F172A" stroke="#134E4A" stroke-width="1.5"/>
    <rect x="56" y="96" width="330" height="168" rx="14" stroke="#5EEAD4" stroke-opacity="0.28" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.16;0.42;0.16" dur="8s" repeatCount="indefinite"/>
    </rect>

    <text x="84" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#5EEAD4">core/</text>
    <text x="84" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#F1F5F9">omnimentor-core.md</text>
    <text x="84" y="194" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94A3B8">5 teaching modes / 20 commands</text>
    <text x="84" y="216" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94A3B8">learner profile / spaced review</text>
    <text x="84" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#475569">SINGLE SOURCE OF TRUTH</text>

    <rect x="560" y="64" width="584" height="72" rx="12" fill="#0F141C" stroke="#263041" stroke-width="1.5"/>
    <text x="584" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Claude Code</text>
    <text x="584" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7C8AA0">.claude/skills/omnimentor/SKILL.md</text>

    <rect x="560" y="144" width="584" height="72" rx="12" fill="#0F141C" stroke="#263041" stroke-width="1.5"/>
    <text x="584" y="174" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">ChatGPT</text>
    <text x="584" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7C8AA0">chatgpt/instructions.txt + knowledge file</text>

    <rect x="560" y="224" width="584" height="72" rx="12" fill="#0F141C" stroke="#263041" stroke-width="1.5"/>
    <text x="584" y="254" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">OpenCode</text>
    <text x="584" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7C8AA0">.claude/skills (native compatibility)</text>

    <path d="M386 180C470 180 470 100 560 100" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 7" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M386 180H560" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 7" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M386 180C470 180 470 260 560 260" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 7" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <text x="56" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#475569">scripts/sync.ps1 regenerates the skill / scripts/check-progress.ps1 validates learner data</text>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="20" stroke="#1E293B" stroke-width="2"/>
</svg>
