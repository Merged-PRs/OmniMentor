<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none" role="img" aria-labelledby="demoTitle demoDesc">
  <title id="demoTitle">OmniMentor walkthrough</title>
  <desc id="demoDesc">A 30-second animated walkthrough: task, mistake, hint, fix, feedback, and the learner profile update.</desc>

  <defs>
    <linearGradient id="demoBg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#0E1622"/>
    </linearGradient>
    <pattern id="demoGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" stroke="#131C28" stroke-width="1"/>
    </pattern>
    <filter id="demoGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <clipPath id="demoCard">
      <rect x="1" y="1" width="1198" height="598" rx="20"/>
    </clipPath>
    <clipPath id="cmdClip">
      <rect x="96" y="144" width="360" height="26">
        <animate attributeName="width" values="0;360" dur="1.2s" begin="1.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#demoCard)">
    <rect width="1200" height="600" fill="url(#demoBg)"/>
    <rect width="1200" height="600" fill="url(#demoGrid)" opacity="0.35"/>
    <circle cx="170" cy="80" r="180" fill="#0D9488" opacity="0.16" filter="url(#demoGlow)"/>
    <circle cx="1050" cy="540" r="200" fill="#4F46E5" opacity="0.12" filter="url(#demoGlow)"/>

    <text x="48" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="3" fill="#5EEAD4">30-SECOND WALKTHROUGH</text>
    <text x="1152" y="44" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1" fill="#475569">CLAUDE CODE / OPENCODE / CHATGPT</text>

    <rect x="48" y="80" width="1104" height="440" rx="14" fill="#0F141C" stroke="#263041" stroke-width="1.5"/>
    <circle cx="72" cy="104" r="3.5" fill="#334155"/>
    <circle cx="85" cy="104" r="3.5" fill="#334155"/>
    <circle cx="98" cy="104" r="3.5" fill="#334155"/>
    <path d="M48 122H1152" stroke="#1E293B" stroke-width="1"/>

    <g>
      <text x="76" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5EEAD4">$</text>
      <text x="96" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#E2E8F0" clip-path="url(#cmdClip)">@omnimentor /learn Python dictionaries</text>
      <rect x="440" y="146" width="8" height="17" rx="1" fill="#5EEAD4">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="76" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#7C8AA0">Task: count word frequencies. Confidence: 1-5.</text>

    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.23;0.24;0.33;0.34;1" dur="30s" repeatCount="indefinite"/>
      <text x="76" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#FBBF24">YOU</text>
      <text x="128" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#E2E8F0">counts[w] += 1</text>
      <text x="128" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#F87171">KeyError: 'the'</text>
    </g>

    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.40;0.41;0.50;0.51;1" dur="30s" repeatCount="indefinite"/>
      <text x="76" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5EEAD4">COACH</text>
      <text x="140" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">What is different the first time a key appears?</text>
    </g>

    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.53;0.54;0.63;0.64;1" dur="30s" repeatCount="indefinite"/>
      <text x="76" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#FBBF24">YOU</text>
      <text x="128" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#E2E8F0">counts[w] = counts.get(w, 0) + 1</text>
      <text x="128" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#34D399">OK</text>
    </g>

    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.67;0.68;0.76;0.77;1" dur="30s" repeatCount="indefinite"/>
      <text x="76" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5EEAD4">REVIEW</text>
      <text x="140" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#34D399">Working</text>
      <text x="212" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#475569">/</text>
      <text x="232" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#FBBF24">Fragile</text>
      <text x="304" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#475569">/</text>
      <text x="324" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#5EEAD4">Improve</text>
      <text x="410" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748B">no test for punctuation</text>
    </g>

    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.77;0.78;0.87;0.88;1" dur="30s" repeatCount="indefinite"/>
      <text x="76" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#34D399">PROFILE</text>
      <text x="156" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94A3B8">dicts · learning · independent · 3/5 · next review Nov 9</text>
    </g>

    <rect x="48" y="530" width="1104" height="2" rx="1" fill="#1E293B"/>
    <rect x="48" y="530" width="1104" height="2" rx="1" fill="#5EEAD4">
      <animate attributeName="width" values="0;1104" dur="30s" repeatCount="indefinite"/>
    </rect>
    <text x="48" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" fill="#475569">ATTEMPT / HINT / FEEDBACK / EVIDENCE</text>
    <text x="1152" y="566" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#475569">loops every 30s</text>
  </g>

  <rect x="1" y="1" width="1198" height="598" rx="20" stroke="#1E293B" stroke-width="2"/>
</svg>
